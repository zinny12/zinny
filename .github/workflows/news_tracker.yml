name: 반도체 뉴스 트래커

on:
  # 매일 한국시간 오전 7시 자동 실행 (UTC 22:00 = KST 07:00)
  schedule:
    - cron: '0 22 * * *'

  # GitHub에서 수동 실행 버튼도 활성화
  workflow_dispatch:

jobs:
  news-crawl:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install requests beautifulsoup4

      - name: 뉴스 크롤링 실행
        run: python crawling
